<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dash Delivery — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#cdeaf5;
    --sky-deep:#a9dcee;
    --blue-mid:#6fc3e4;
    --blue-deep:#1d6e93;
    --blue-ink:#123a4d;
    --orange:#f0993d;
    --orange-deep:#d97728;
    --orange-light:#ffc27a;
    --cream:#fbf3e7;
    --white:#ffffff;
    --ink:#193240;
    --ink-soft:#4c6675;
    --green:#3fae6a;
    --red:#e2604f;
    --shadow-out: 8px 8px 16px rgba(19,58,77,.18), -6px -6px 14px rgba(255,255,255,.65);
    --shadow-in: inset 4px 4px 8px rgba(19,58,77,.14), inset -3px -3px 8px rgba(255,255,255,.7);
    --shadow-btn: 0 6px 0 var(--orange-deep), 0 10px 18px rgba(217,119,40,.35);
    --shadow-btn-blue: 0 6px 0 #145875, 0 10px 18px rgba(29,110,147,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #e7f6fb 0%, transparent 45%),
      linear-gradient(160deg, #dff2f8 0%, var(--sky) 55%, var(--sky-deep) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 12px;
    color:var(--ink);
  }
  h1,h2,h3,h4{font-family:'Baloo 2',sans-serif; margin:0;}

  /* ---------- Phone frame ---------- */
  .device{
    width:390px;
    max-width:100%;
    height:820px;
    max-height:92vh;
    background:linear-gradient(160deg,#0f2733,#0a1c26);
    border-radius:46px;
    padding:14px;
    box-shadow: 0 30px 60px rgba(10,30,40,.35), 0 4px 0 rgba(255,255,255,.15) inset;
    position:relative;
  }
  .screen{
    width:100%;
    height:100%;
    background:linear-gradient(180deg,#eaf7fb 0%, var(--sky) 100%);
    border-radius:34px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#0a1c26; border-radius:0 0 16px 16px; z-index:50;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px 6px; font-family:'Nunito'; font-weight:800; font-size:13px; color:var(--blue-ink);
    flex-shrink:0;
  }
  .statusbar .icons{display:flex; gap:5px; align-items:center;}

  /* ---------- Rain overlay (signature weather element) ---------- */
  .rain-layer{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:5; opacity:0; transition:opacity .5s;}
  .rain-layer.on{opacity:1;}
  .drop{
    position:absolute; top:-40px; width:2px; height:16px; border-radius:2px;
    background:linear-gradient(180deg, rgba(29,110,147,0), rgba(29,110,147,.55));
    animation: fall linear infinite;
  }
  @keyframes fall{ to{ transform:translateY(760px); opacity:.2; } }

  /* ---------- Content area ---------- */
  .content{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 18px 100px; position:relative;}
  .content::-webkit-scrollbar{width:0;}
  .fade-in{animation: fadeIn .35s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Header brand row ---------- */
  .brand-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0 14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-badge{
    width:44px;height:44px;border-radius:16px;
    background:linear-gradient(145deg, var(--orange-light), var(--orange) 60%, var(--orange-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-out);
    font-family:'Baloo 2'; font-weight:800; color:#fff; font-size:20px;
    text-shadow: 0 2px 0 rgba(150,70,10,.5);
  }
  .brand-name{font-family:'Baloo 2'; font-weight:800; font-size:19px; color:var(--blue-deep); letter-spacing:.2px;}
  .brand-name span{color:var(--orange-deep);}
  .loc-pill{font-size:11px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:4px; margin-top:1px;}

  .weather-toggle{
    display:flex; align-items:center; gap:6px; background:var(--white); border-radius:20px; padding:6px 10px 6px 6px;
    box-shadow:var(--shadow-out); cursor:pointer; user-select:none; border:none;
  }
  .weather-toggle .dot{width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:linear-gradient(145deg,var(--blue-mid),var(--blue-deep)); transition:.3s;}
  .weather-toggle.sunny .dot{background:linear-gradient(145deg,#ffd977,#f0993d);}
  .weather-toggle span.label{font-size:11px;font-weight:800;color:var(--ink-soft);}

  /* ---------- Cards / clay components ---------- */
  .card{
    background:var(--white);
    border-radius:22px;
    box-shadow:var(--shadow-out);
    padding:16px;
  }
  .banner{
    border-radius:26px;
    padding:18px 20px;
    background:linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
    color:#fff; position:relative; overflow:hidden;
    box-shadow:var(--shadow-out);
    margin-bottom:18px;
  }
  .banner.rain-theme{background:linear-gradient(135deg,#154e69,#2f8fb5);}
  .banner h3{font-size:17px; margin-bottom:4px;}
  .banner p{font-size:12.5px; opacity:.92; margin:0; font-weight:700; max-width:70%;}
  .banner .badge{
    position:absolute; right:14px; top:14px; background:var(--orange);
    padding:6px 10px; border-radius:12px; font-size:11px; font-weight:800; box-shadow:0 4px 0 var(--orange-deep);
  }

  .search-bar{
    display:flex; align-items:center; gap:10px; background:var(--white);
    border-radius:18px; padding:12px 14px; box-shadow:var(--shadow-in); margin-bottom:16px;
  }
  .search-bar input{border:none; outline:none; background:transparent; font-family:'Nunito'; font-weight:700; font-size:13.5px; flex:1; color:var(--ink);}
  .search-bar input::placeholder{color:#9fb4bd;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:18px 0 12px;}
  .section-title h4{font-size:15px; color:var(--blue-ink);}
  .section-title .link{font-size:11.5px; font-weight:800; color:var(--orange-deep); cursor:pointer;}

  .services{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 8px; margin-bottom:6px;}
  .service{display:flex;flex-direction:column;align-items:center; gap:7px; cursor:pointer;}
  .service .ic{
    width:58px;height:58px;border-radius:20px; display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-out); transition:transform .15s;
  }
  .service:active .ic{transform:scale(.92);}
  .service span{font-size:10.5px; font-weight:800; color:var(--ink-soft); text-align:center;}

  .vendor-card{
    display:flex; gap:12px; background:var(--white); border-radius:20px; padding:10px; margin-bottom:12px;
    box-shadow:var(--shadow-out); cursor:pointer; align-items:center;
  }
  .vendor-thumb{width:64px;height:64px;border-radius:16px; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:26px; box-shadow:var(--shadow-in);}
  .vendor-info{flex:1; min-width:0;}
  .vendor-info h4{font-size:13.5px; color:var(--blue-ink); margin-bottom:3px;}
  .vendor-meta{display:flex; gap:10px; font-size:11px; font-weight:800; color:var(--ink-soft); flex-wrap:wrap;}
  .vendor-meta .star{color:var(--orange-deep);}
  .chip{
    display:inline-flex; align-items:center; padding:7px 13px; border-radius:14px; font-size:11.5px; font-weight:800;
    background:var(--white); box-shadow:var(--shadow-out); color:var(--ink-soft); margin-right:8px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:linear-gradient(145deg,var(--orange-light),var(--orange)); color:#fff; box-shadow:0 4px 0 var(--orange-deep);}
  .chip-row{display:flex; overflow-x:auto; padding-bottom:6px; margin-bottom:4px;}
  .chip-row::-webkit-scrollbar{display:none;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; cursor:pointer; font-family:'Nunito'; font-weight:800; font-size:14px;
    border-radius:18px; padding:15px; color:#fff; width:100%;
    background:linear-gradient(145deg,var(--orange-light),var(--orange));
    box-shadow:var(--shadow-btn);
    transition:transform .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--orange-deep);}
  .btn.blue{background:linear-gradient(145deg,var(--blue-mid),var(--blue-deep)); box-shadow:var(--shadow-btn-blue);}
  .btn.blue:active{box-shadow:0 2px 0 #145875;}
  .btn.ghost{background:var(--white); color:var(--blue-deep); box-shadow:var(--shadow-out);}
  .btn.ghost:active{box-shadow:var(--shadow-in); transform:none;}
  .btn.sm{padding:10px; font-size:12.5px; border-radius:14px;}

  .icon-btn{
    width:38px;height:38px;border-radius:13px; display:flex;align-items:center;justify-content:center;
    background:var(--white); box-shadow:var(--shadow-out); border:none; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{box-shadow:var(--shadow-in);}

  .topbar{display:flex; align-items:center; gap:12px; padding:16px 18px 8px;}
  .topbar h3{font-size:16px; color:var(--blue-ink); flex:1;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; left:0; right:0; bottom:0; height:82px; background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px); border-top:1px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:space-around; z-index:40;
    box-shadow:0 -6px 20px rgba(19,58,77,.08);
  }
  .navitem{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding-top:6px;}
  .navitem .bub{width:38px;height:38px;border-radius:13px; display:flex;align-items:center;justify-content:center; transition:.2s;}
  .navitem.active .bub{background:linear-gradient(145deg,var(--orange-light),var(--orange)); box-shadow:0 4px 0 var(--orange-deep);}
  .navitem span{font-size:10px; font-weight:800; color:var(--ink-soft);}
  .navitem.active span{color:var(--orange-deep);}

  /* ---------- Cart floating bar ---------- */
  .cartbar{
    position:absolute; left:16px; right:16px; bottom:96px; z-index:41;
    background:linear-gradient(145deg,var(--blue-mid),var(--blue-deep)); color:#fff;
    border-radius:20px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow-btn-blue); cursor:pointer;
    transform:translateY(120px); transition:transform .3s ease; opacity:0;
  }
  .cartbar.show{transform:translateY(0); opacity:1;}
  .cartbar b{font-size:13.5px;}
  .cartbar small{opacity:.85; font-weight:700; font-size:11px;}

  /* menu item */
  .menu-item{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #e7f2f6;}
  .menu-thumb{width:56px;height:56px;border-radius:16px; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:24px; box-shadow:var(--shadow-in);}
  .menu-info{flex:1; min-width:0;}
  .menu-info h4{font-size:13px; color:var(--blue-ink); margin-bottom:2px;}
  .menu-info p{margin:0; font-size:11px; color:var(--ink-soft); font-weight:700;}
  .price{font-size:12.5px; font-weight:900; color:var(--orange-deep); margin-top:3px;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .stepbtn{width:26px;height:26px;border-radius:9px; border:none; background:var(--white); box-shadow:var(--shadow-out); font-weight:900; color:var(--blue-deep); cursor:pointer; font-size:14px; line-height:1;}
  .stepbtn.add{background:linear-gradient(145deg,var(--orange-light),var(--orange)); color:#fff; box-shadow:0 3px 0 var(--orange-deep);}
  .qty{font-weight:900; font-size:13px; min-width:14px; text-align:center;}

  /* cart line */
  .cart-line{display:flex; align-items:center; gap:12px; padding:12px; background:var(--white); border-radius:16px; margin-bottom:10px; box-shadow:var(--shadow-out);}
  .cart-line .ci-thumb{width:44px;height:44px;border-radius:12px; display:flex;align-items:center;justify-content:center;font-size:20px; box-shadow:var(--shadow-in); flex-shrink:0;}
  .cart-line .ci-info{flex:1;}
  .cart-line .ci-info h4{font-size:12.5px; color:var(--blue-ink);}
  .cart-line .ci-info small{font-size:11px; color:var(--ink-soft); font-weight:700;}

  .row-between{display:flex; justify-content:space-between; align-items:center;}
  .divider{height:1px; background:#e2eff4; margin:14px 0;}
  .sumline{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;}
  .sumline.total{font-size:15px; font-weight:900; color:var(--blue-ink);}

  .addr-chip{display:flex; align-items:center; gap:10px; background:var(--white); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow-out); margin-bottom:10px; cursor:pointer; border:2px solid transparent;}
  .addr-chip.active{border-color:var(--orange);}
  .addr-chip .ic{width:34px;height:34px;border-radius:11px; background:linear-gradient(145deg,var(--sky-deep),var(--blue-mid)); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .addr-chip h4{font-size:12.5px; color:var(--blue-ink);}
  .addr-chip p{margin:0; font-size:11px; color:var(--ink-soft); font-weight:700;}

  .pay-option{display:flex; align-items:center; gap:12px; background:var(--white); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow-out); margin-bottom:10px; cursor:pointer; border:2px solid transparent;}
  .pay-option.active{border-color:var(--blue-deep);}
  .pay-option .radio{width:18px;height:18px;border-radius:50%; border:2.5px solid #cfe0e6; flex-shrink:0; display:flex;align-items:center;justify-content:center;}
  .pay-option.active .radio{border-color:var(--blue-deep);}
  .pay-option.active .radio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--blue-deep);}

  textarea, .input{width:100%; border:none; border-radius:16px; background:var(--white); box-shadow:var(--shadow-in); padding:13px 14px; font-family:'Nunito'; font-weight:700; font-size:12.5px; color:var(--ink); resize:none; outline:none;}

  /* ---------- Tracking ---------- */
  .map-wrap{
    border-radius:24px; overflow:hidden; height:230px; position:relative; margin-bottom:16px;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.5), transparent 40%),
      linear-gradient(160deg,#bfe6f2,#8fd0e6 60%, #6fc3e4);
    box-shadow:var(--shadow-out);
  }
  .map-grid{position:absolute; inset:0; opacity:.35;
    background-image: linear-gradient(#fff 1.5px, transparent 1.5px), linear-gradient(90deg, #fff 1.5px, transparent 1.5px);
    background-size:26px 26px;
  }
  .route-path{position:absolute; inset:0;}
  .pin{position:absolute; width:26px;height:26px; transform:translate(-50%,-100%);}
  .rider{position:absolute; width:34px; height:34px; transform:translate(-50%,-50%); offset-rotate:0deg; z-index:6; transition:offset-distance 1s linear;}
  .eta-pill{position:absolute; left:14px; top:14px; background:#fff; border-radius:14px; padding:8px 12px; box-shadow:var(--shadow-out); font-size:11px; font-weight:900; color:var(--blue-deep); display:flex; align-items:center; gap:6px;}
  .eta-pill b{font-size:15px; color:var(--orange-deep);}

  .timeline{margin:6px 0 18px;}
  .tl-item{display:flex; gap:12px; position:relative; padding-bottom:22px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item .tl-dot{width:26px;height:26px;border-radius:50%; background:#e6eef1; display:flex;align-items:center;justify-content:center; flex-shrink:0; z-index:2; transition:.3s; font-size:12px; color:#9fb4bd; font-weight:900;}
  .tl-item.done .tl-dot{background:linear-gradient(145deg,var(--orange-light),var(--orange)); color:#fff; box-shadow:0 3px 0 var(--orange-deep);}
  .tl-item.now .tl-dot{background:linear-gradient(145deg,var(--blue-mid),var(--blue-deep)); color:#fff; box-shadow:0 0 0 5px rgba(29,110,147,.18);}
  .tl-item:not(:last-child)::before{content:''; position:absolute; left:12.5px; top:26px; bottom:0; width:2px; background:#e6eef1;}
  .tl-item.done:not(:last-child)::before{background:var(--orange);}
  .tl-text h4{font-size:12.5px; color:var(--blue-ink); margin-bottom:2px;}
  .tl-text p{margin:0; font-size:11px; color:var(--ink-soft); font-weight:700;}

  .driver-card{display:flex; align-items:center; gap:12px; background:var(--white); border-radius:20px; padding:14px; box-shadow:var(--shadow-out); margin-bottom:16px;}
  .avatar{width:52px;height:52px;border-radius:16px; background:linear-gradient(145deg,#ffe2b8,var(--orange)); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:var(--shadow-in); flex-shrink:0;}
  .driver-info{flex:1;}
  .driver-info h4{font-size:13.5px; color:var(--blue-ink);}
  .driver-info small{font-size:11px; font-weight:800; color:var(--ink-soft);}
  .driver-actions{display:flex; gap:8px;}

  /* status chip */
  .status-chip{font-size:10px; font-weight:900; padding:5px 10px; border-radius:10px; display:inline-block;}
  .status-chip.placed{background:#fff1de; color:var(--orange-deep);}
  .status-chip.transit{background:#e2f3fb; color:var(--blue-deep);}
  .status-chip.done{background:#e4f7ec; color:var(--green);}

  .order-card{background:var(--white); border-radius:18px; padding:14px; box-shadow:var(--shadow-out); margin-bottom:12px; cursor:pointer;}
  .order-card .row-between{margin-bottom:6px;}
  .order-card h4{font-size:13px; color:var(--blue-ink);}
  .order-card p{margin:0; font-size:11px; font-weight:700; color:var(--ink-soft);}

  /* wallet */
  .balance-card{
    border-radius:24px; padding:22px; color:#fff; margin-bottom:18px; position:relative; overflow:hidden;
    background:linear-gradient(140deg, var(--blue-deep), #2f8fb5 70%);
    box-shadow:var(--shadow-out);
  }
  .balance-card .amt{font-family:'Baloo 2'; font-size:32px; font-weight:800; margin:4px 0 14px;}
  .balance-card::after{content:''; position:absolute; right:-30px; bottom:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.08);}
  .tx{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #e7f2f6;}
  .tx .tic{width:38px;height:38px;border-radius:12px; display:flex;align-items:center;justify-content:center; font-size:16px; flex-shrink:0;}
  .tx h4{font-size:12.5px; color:var(--blue-ink); margin-bottom:1px;}
  .tx small{font-size:10.5px; font-weight:700; color:var(--ink-soft);}
  .tx .amt2{font-weight:900; font-size:12.5px; margin-left:auto;}

  /* profile */
  .profile-head{display:flex; align-items:center; gap:14px; padding:8px 0 18px;}
  .profile-avatar{width:64px;height:64px;border-radius:20px; background:linear-gradient(145deg,var(--sky-deep),var(--blue-mid)); display:flex;align-items:center;justify-content:center; font-size:26px; box-shadow:var(--shadow-out);}
  .stat-row{display:flex; gap:10px; margin-bottom:18px;}
  .stat-box{flex:1; background:var(--white); border-radius:16px; padding:12px; text-align:center; box-shadow:var(--shadow-out);}
  .stat-box b{font-family:'Baloo 2'; font-size:18px; color:var(--blue-deep); display:block;}
  .stat-box span{font-size:10px; font-weight:800; color:var(--ink-soft);}
  .list-row{display:flex; align-items:center; gap:12px; padding:13px 4px; cursor:pointer; border-bottom:1px solid #e7f2f6;}
  .list-row .ic{width:36px;height:36px;border-radius:12px; background:var(--sky); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .list-row span.lbl{flex:1; font-weight:800; font-size:13px; color:var(--blue-ink);}
  .switch{width:42px;height:24px;border-radius:12px; background:#dbe7ec; position:relative; cursor:pointer; flex-shrink:0; transition:.2s;}
  .switch.on{background:linear-gradient(145deg,var(--orange-light),var(--orange));}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:18px;height:18px;border-radius:50%; background:#fff; transition:.2s; box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .switch.on::after{left:21px;}

  /* modal / sheet */
  .sheet-backdrop{position:absolute; inset:0; background:rgba(10,30,40,.45); z-index:60; opacity:0; pointer-events:none; transition:.25s;}
  .sheet-backdrop.show{opacity:1; pointer-events:all;}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--cream); border-radius:28px 28px 0 0; padding:20px 20px 26px; z-index:61; transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 30px rgba(0,0,0,.2);}
  .sheet-backdrop.show .sheet{transform:translateY(0);}
  .sheet-handle{width:40px;height:5px;border-radius:3px; background:#d9c9b3; margin:0 auto 16px;}

  /* toast */
  .toast{position:absolute; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-size:12px; font-weight:800; z-index:80; opacity:0; transition:.25s; white-space:nowrap;}

function findMenuItem(id){
  for(const v of VENDORS){ const m = v.menu.find(x=>x.id===id); if(m) return {...m, vendorId:v.id, vendorName:v.name}; }
}
function cartTotal(){
  return state.cart.reduce((s,c)=>{ const m = findMenuItem(c.itemId); return s + m.price*c.qty; },0);
}
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }

/* =========================================================
   NAVIGATION
========================================================= */
function go(target, payload){
  if(['home','orders','wallet','profile'].includes(target)){
    state.tab = target; state.screen = target;
  } else {
    state.screen = target;
  }
  if(payload) Object.assign(state, payload);
  render();
  document.getElementById('content').scrollTop = 0;
}

function buildBottomNav(){
  document.getElementById('bottomnav').innerHTML = `
    <div class="navitem" data-tab="home" onclick="go('home')"><div class="bub">${ICONS.home}</div><span>Home</span></div>
    <div class="navitem" data-tab="orders" onclick="go('orders')"><div class="bub">${ICONS.orders}</div><span>Orders</span></div>
    <div class="navitem" data-tab="wallet" onclick="go('wallet')"><div class="bub">${ICONS.wallet}</div><span>Wallet</span></div>
    <div class="navitem" data-tab="profile" onclick="go('profile')"><div class="bub">${ICONS.user}</div><span>Profile</span></div>
  `;
}

function render(){
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === state.tab);
  });
  document.getElementById('rainLayer').classList.toggle('on', state.weather==='rain');
  buildRain();

  const map = {
    home: renderHome, vendor: renderVendor, cart: renderCart, checkout: renderCheckout,
    tracking: renderTracking, orders: renderOrders, receipt: renderReceipt,
    wallet: renderWallet, profile: renderProfile, logistics: renderLogistics,
  };
  document.getElementById('content').innerHTML = `<div class="fade-in">${map[state.screen]()}</div>`;

  const cb = document.getElementById('cartbar');
  const showCart = cartCount()>0 && ['home','vendor','cart'].includes(state.screen);
  cb.classList.toggle('show', showCart);
  document.getElementById('cartCount').textContent = `${cartCount()} item${cartCount()===1?'':'s'} · in cart`;
  document.getElementById('cartTotal').textContent = `₱${cartTotal().toFixed(2)}`;
}

function buildRain(){
  const layer = document.getElementById('rainLayer');
  if(layer.dataset.built) return;
  let html='';
  for(let i=0;i<28;i++){
    const left = Math.random()*100;
    const dur = (0.6+Math.random()*0.8).toFixed(2);
    const delay = (Math.random()*2).toFixed(2);
    html += `<div class="drop" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s;"></div>`;
  }
  layer.innerHTML = html;
  layer.dataset.built = '1';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}

}
function closeSheet(e){

}

    return `

      <div class="menu-thumb" style="background:var(--sky);">${m.emoji}</div>
      <div class="menu-info">

      </div>
      ${qty===0 ? `<button class="stepbtn add" onclick="changeQty('${m.id}','${v.id}',1)">${ICONS.plus}</button>` :
      `<div class="stepper">
        <button class="stepbtn" onclick="changeQty('${m.id}','${v.id}',-1)">${ICONS.minus}</button>
        <span class="qty">${qty}</span>
        <button class="stepbtn add" onclick="changeQty('${m.id}','${v.id}',1)">${ICONS.plus}</button>
      </div>`}
    </div>`;
  }).join('')}
  `;
}

function changeQty(itemId, vendorId, delta){
  if(state.cart.length && state.cart[0].vendorId !== vendorId){
    toast(`Started a new cart for ${VENDORS.find(v=>v.id===vendorId).name}`);
    state.cart = [];
  }
  const line = state.cart.find(c=>c.itemId===itemId);
  if(line){
    line.qty += delta;
    if(line.qty<=0) state.cart = state.cart.filter(c=>c.itemId!==itemId);
  } else if(delta>0){
    state.cart.push({itemId, vendorId, qty:1});
  }
  render();
}

  if(state.cart.length===0){

    <div class="topbar" style="padding-left:0;"><button class="icon-btn" onclick="go('home')">${ICONS.back}</button><h3>Your cart</h3></div>

    `;

  const vendorName = findMenuItem(state.cart[0].itemId).vendorName;
  const subtotal = cartTotal();

  return `
  <div class="topbar" style="padding-left:0;"><button class="icon-btn" onclick="go('home')">${ICONS.back}</button><h3>Cart · ${vendorName}</h3></div>
  ${state.cart.map(c=>{
    const m = findMenuItem(c.itemId);
    return `
    <div class="cart-line">
      <div class="ci-thumb" style="background:var(--sky);">${m.emoji}</div>
      <div class="ci-info"><h4>${m.name}</h4><small>₱${m.price.toFixed(2)} each</small></div>
      <div class="stepper">
        <button class="stepbtn" onclick="changeQty('${c.itemId}','${c.vendorId}',-1)">${ICONS.minus}</button>
        <span class="qty">${c.qty}</span>
        <button class="stepbtn add" onclick="changeQty('${c.itemId}','${c.vendorId}',1)">${ICONS.plus}</button>
      </div>
    </div>`;
  }).join('')}
  <div class="card" style="margin-top:8px;">
    <div class="sumline"><span>Subtotal</span><span>₱${subtotal.toFixed(2)}</span></div>
    <div class="sumline"><span>Delivery fee</span><span>₱${fee.toFixed(2)}</span></div>
    <div class="sumline"><span>Est. tax</span><span>₱${tax.toFixed(2)}</span></div>
    <div class="divider" style="margin:10px 0;"></div>

  <div style="height:14px;"></div>
  <button class="btn" onclick="go('checkout')">Checkout · ₱${(subtotal+fee+tax).toFixed(2)}</button>

}

/* =========================================================
   SCREEN: CHECKOUT
========================================================= */
function renderCheckout(){
  const subtotal = cartTotal(), fee=39, tax=Math.round(subtotal*0.02), total=subtotal+fee+tax;
  return `
  <div class="topbar" style="padding-left:0;"><button class="icon-btn" onclick="go('cart')">${ICONS.back}</button><h3>Checkout</h3></div>

  <div class="section-title" style="margin-top:0;"><h4>Deliver to</h4></div>
  ${ADDRESSES.map(a=>`
    <div class="addr-chip ${state.address.id===a.id?'active':''}" onclick="setAddress('${a.id}')">
      <div class="ic">${ICONS.pin}</div>
      <div><h4>${a.label}</h4><p>${a.detail}</p></div>
    </div>
  `).join('')}

  <div class="section-title"><h4>Payment</h4></div>
  ${[
    {id:'wallet', label:'Dash Wallet', sub:`Balance ₱${state.wallet.toFixed(2)}`, ic:'💳'},
    {id:'card', label:'GCash', sub:'Linked mobile wallet', ic:'📱'},
    {id:'cash', label:'Cash on delivery', sub:'Pay the rider directly', ic:'💵'},
  ].map(p=>`
    <div class="pay-option ${state.payment===p.id?'active':''}" onclick="setPayment('${p.id}')">
      <div class="radio"></div>
      <div style="flex:1;"><h4 style="font-size:12.5px;color:var(--blue-ink);">${p.label}</h4><small style="font-size:11px;font-weight:700;color:var(--ink-soft);">${p.sub}</small></div>
      <span style="font-size:18px;">${p.ic}</span>
    </div>
  `).join('')}

  <div class="section-title"><h4>Delivery note</h4></div>
  <textarea rows="3" placeholder="e.g. Leave at the door, ring twice..."></textarea>

  <div class="card" style="margin-top:16px;">
    <div class="sumline total"><span>Total to pay</span><span>₱${total.toFixed(2)}</span></div>
  </div>
  <div style="height:14px;"></div>
  <button class="btn blue" onclick="placeOrder()">Place order</button>
  `;
}
function setAddress(id){ state.address = ADDRESSES.find(a=>a.id===id); render(); }
function setPayment(id){ state.payment = id; render(); }

function placeOrder(){
  const vendor = VENDORS.find(v=>v.id===state.cart[0].vendorId);
  const subtotal = cartTotal(), fee=39, tax=Math.round(subtotal*0.02), total=subtotal+fee+tax;
  const order = {
    id: 'DS-'+(orderSeq++),
    type:'food',
    vendorName: vendor.name,
    items: state.cart.map(c=>({...findMenuItem(c.itemId), qty:c.qty})),
    total, address: state.address, payment: state.payment,
    status:0, // 0 placed,1 preparing,2 enroute,3 delivered
    etaMin: 18 + Math.floor(Math.random()*12),
    placedAt: new Date(),
  };
  if(state.payment==='wallet') state.wallet -= total;
  state.orders.unshift(order);
  state.activeOrderId = order.id;
  state.cart = [];
  go('tracking');
  toast('Order placed! Tracking is live.');
  startTracking(order.id);
}

/* =========================================================
   SCREEN: LOGISTICS (Parcels / Documents / Truck Rental)
========================================================= */
function renderLogistics(){
  const lt = LOGISTICS_TYPES[state.ltype || 'parcel'];
  const est = lt.base + Math.round(lt.perKm*3.2);
  return `
  <div class="topbar" style="padding-left:0;"><button class="icon-btn" onclick="go('home')">${ICONS.back}</button><h3>${lt.label}</h3></div>
  <div class="card" style="display:flex; gap:12px; align-items:center; margin-bottom:16px;">
    <div class="vendor-thumb" style="width:56px;height:56px;font-size:26px;background:var(--sky);">${lt.icon}</div>
    <p style="margin:0; font-size:12px; font-weight:700; color:var(--ink-soft);">${lt.desc}</p>
  </div>

  <div class="chip-row" style="margin-bottom:6px;">
    ${Object.entries(LOGISTICS_TYPES).map(([k,v])=>`<div class="chip ${state.ltype===k?'active':''}" onclick="go('logistics',{ltype:'${k}'})">${v.icon} ${v.label.split(' ').slice(-1)[0]}</div>`).join('')}
  </div>

  <div class="section-title" style="margin-top:14px;"><h4>Pickup from</h4></div>
  ${ADDRESSES.map(a=>`
    <div class="addr-chip ${state.address.id===a.id?'active':''}" onclick="setAddress('${a.id}')">
      <div class="ic">${ICONS.pin}</div><div><h4>${a.label}</h4><p>${a.detail}</p></div>
    </div>`).join('')}

  <div class="section-title" style="margin-top:0;"><h4>Drop-off address</h4></div>
  <input class="input" placeholder="e.g. 12 Rizal St, Poblacion, Bugallon" id="logAddr" style="margin-bottom:14px;">

  ${state.ltype==='truck' ? `
  <div class="section-title" style="margin-top:0;"><h4>Truck type</h4></div>
  <div class="chip-row">
    <div class="chip active">Small pickup</div><div class="chip">Closed van</div><div class="chip">6-wheeler</div>
  </div>` : `
  <div class="section-title" style="margin-top:0;"><h4>${state.ltype==='document'?'Envelope size':'Parcel size'}</h4></div>
  <div class="chip-row">
    <div class="chip active">Small</div><div class="chip">Medium</div><div class="chip">Large</div>
  </div>`}

  <textarea rows="2" placeholder="Notes for the rider (e.g. fragile, ID required on pickup)" style="margin-top:14px;"></textarea>

  <div class="card" style="margin:14px 0;">
    <div class="sumline"><span>Base fare</span><span>₱${lt.base.toFixed(2)}</span></div>
    <div class="sumline"><span>Distance (est. 3.2 km)</span><span>₱${Math.round(lt.perKm*3.2).toFixed(2)}</span></div>
    <div class="divider" style="margin:10px 0;"></div>
    <div class="sumline total"><span>Total</span><span>₱${est.toFixed(2)}</span></div>
  </div>
  <button class="btn" onclick="placeLogisticsOrder()">Confirm ${state.ltype==='truck'?'booking':'pickup'}</button>
  `;
}
function placeLogisticsOrder(){
  const lt = LOGISTICS_TYPES[state.ltype || 'parcel'];
  const addr = document.getElementById('logAddr')?.value || 'Nearby drop-off point';
  const est = lt.base + Math.round(lt.perKm*3.2);
  const order = {
    id:'DS-'+(orderSeq++), type:state.ltype, vendorName:lt.label,
    items:[{name:lt.label, qty:1}], total:est,
    address:{label:'Drop-off', detail:addr}, payment:state.payment,
    status:0, etaMin: state.ltype==='truck' ? 40+Math.floor(Math.random()*20) : 15+Math.floor(Math.random()*10),
    placedAt:new Date(),
  };
  state.orders.unshift(order);
  state.activeOrderId = order.id;
  go('tracking');
  toast(state.ltype==='truck' ? 'Truck booking confirmed!' : 'Courier request sent!');
  startTracking(order.id);
}


/* =========================================================
   SCREEN: TRACKING
========================================================= */
const STEPS = [
  {label:'Order confirmed', sub:'Vendor received your order'},
  {label:'Preparing', sub:'Getting everything ready'},
  {label:'Rider on the way', sub:'Heading to your address'},
  {label:'Delivered', sub:'Enjoy! ☔'},
];

function startTracking(orderId){
  clearInterval(state.trackTimer);
  state.trackTimer = setInterval(()=>{
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return clearInterval(state.trackTimer);
    if(order.status < 3){
      order.status += 1;
      if(state.screen==='tracking' && state.activeOrderId===orderId) render();
      if(order.status===3){
        clearInterval(state.trackTimer);
        toast('Delivered! Enjoy 🎉');
      }
    }
  }, 4500);
}

function renderTracking(){
  const order = state.orders.find(o=>o.id===state.activeOrderId) || state.orders[0];
  if(!order) return renderHome();
  const pct = [8, 35, 75, 100][order.status];
  const remaining = Math.max(0, Math.round(order.etaMin * (1 - pct/100)));
  return `
  <div class="topbar" style="padding-left:0;">
    <button class="icon-btn" onclick="go('home')">${ICONS.back}</button>
    <h3>${order.status===3?'Delivered':'Tracking order'}</h3>
    <span class="status-chip ${order.status===3?'done':'transit'}">${order.id}</span>
  </div>

  <div class="map-wrap">
    <div class="map-grid"></div>
    <svg class="route-path" viewBox="0 0 350 230" preserveAspectRatio="none">
      <path id="routePath" d="M40,190 C90,150 70,90 140,80 C210,70 230,120 300,40" fill="none" stroke="#ffffffaa" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
      <circle cx="40" cy="190" r="7" fill="var(--orange)"/>
      <circle cx="300" cy="40" r="7" fill="var(--blue-deep)"/>
    </svg>
    <div class="rider" style="offset-path: path('M40,190 C90,150 70,90 140,80 C210,70 230,120 300,40'); offset-distance:${pct}%;">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <ellipse cx="17" cy="27" rx="12" ry="3" fill="rgba(19,58,77,.18)"/>
        <rect x="19" y="10" width="9" height="8" rx="2.5" fill="var(--orange-deep)"/>
        <circle cx="9" cy="24" r="4.2" fill="#213238"/>
        <circle cx="24" cy="24" r="4.2" fill="#213238"/>
        <path d="M9 24 Q15 12 20 15 L24 24" stroke="var(--orange)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="9" r="4.3" fill="#dfe9ec"/>
        <rect x="10.5" y="7" width="7" height="4" rx="2" fill="var(--blue-mid)"/>
      </svg>
    </div>
    <div class="eta-pill">🕒 ETA <b>${order.status===3?'Arrived':remaining+' min'}</b></div>
  </div>

  <div class="driver-card">
    <div class="avatar">🧑‍✈️</div>
    <div class="driver-info">
      <h4>Micah R. · Rider</h4>
      <small class="star">${ICONS.star} 4.9 · Orange Vespa · #KJ-4471</small>
    </div>
    <div class="driver-actions">
      <button class="icon-btn" onclick="toast('Calling Micah...')">${ICONS.phone}</button>
      <button class="icon-btn" onclick="toast('Opened chat with Micah')">${ICONS.msg}</button>
    </div>
  </div>

  <div class="section-title" style="margin-top:0;"><h4>Order status</h4></div>
  <div class="timeline">
    ${STEPS.map((s,i)=>`
      <div class="tl-item ${i<order.status?'done':''} ${i===order.status?'now':''}">
        <div class="tl-dot">${i<order.status? ICONS.check : (i+1)}</div>
        <div class="tl-text"><h4>${s.label}</h4><p>${s.sub}</p></div>
      </div>
    `).join('')}
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="row-between" style="margin-bottom:8px;"><h4 style="font-size:13px;color:var(--blue-ink);">${order.vendorName}</h4><span style="font-weight:900;color:var(--orange-deep);">₱${order.total.toFixed(2)}</span></div>
    <p style="margin:0;font-size:11.5px;font-weight:700;color:var(--ink-soft);">${order.items.map(i=>`${i.qty}× ${i.name}`).join(', ')}</p>
  </div>
  ${order.status===3? `<button class="btn" onclick="go('receipt',{activeOrderId:'${order.id}'})">View receipt</button>` : `<div class="hint">Status updates automatically — this is a live simulation.</div>`}
  `;
}

/* =========================================================
   SCREEN: ORDERS (history)
========================================================= */
function renderOrders(){
  if(state.orders.length===0){
    return `<div class="brand-row"><h3 style="color:var(--blue-ink);">Your orders</h3></div>
    <div class="empty"><div class="ic">🧾</div><h4>No orders yet</h4><p>Everything you order will show up here.</p></div>`;
  }
  return `
  <div class="brand-row"><h3 style="color:var(--blue-ink);">Your orders</h3></div>
  ${state.orders.map(o=>{
    const chip = o.status===3 ? '<span class="status-chip done">Delivered</span>' : '<span class="status-chip transit">On the way</span>';
    return `
    <div class="order-card" onclick="${o.status===3? `go('receipt',{activeOrderId:'${o.id}'})` : `go('tracking',{activeOrderId:'${o.id}'})`}">
      <div class="row-between"><h4>${o.vendorName}</h4>${chip}</div>
      <p>${o.id} · ${o.items.map(i=>`${i.qty}× ${i.name}`).join(', ')}</p>
      <div class="row-between" style="margin-top:8px;">
        <p>${o.placedAt.toLocaleDateString()} · ${o.placedAt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</p>
        <b style="color:var(--orange-deep); font-size:12.5px;">₱${o.total.toFixed(2)}</b>
      </div>
    </div>`;
  }).join('')}
  `;
}

function renderReceipt(){
  const order = state.orders.find(o=>o.id===state.activeOrderId);
  if(!order) return renderOrders();
  return `
  <div class="topbar" style="padding-left:0;"><button class="icon-btn" onclick="go('orders')">${ICONS.back}</button><h3>Receipt</h3></div>
  <div class="card" style="text-align:center; margin-bottom:16px;">
    <div style="font-size:36px;">✅</div>
    <h4 style="margin:10px 0 4px; font-size:16px; color:var(--blue-ink);">Delivered</h4>
    <p style="margin:0; font-size:11.5px; font-weight:700; color:var(--ink-soft);">${order.id} · ${order.placedAt.toLocaleString()}</p>
  </div>
  <div class="card">
    ${order.items.map(i=>`<div class="sumline"><span>${i.qty}× ${i.name}</span><span>${i.price?'₱'+(i.price*i.qty).toFixed(2):''}</span></div>`).join('')}
    <div class="divider" style="margin:10px 0;"></div>
    <div class="sumline total"><span>Total paid</span><span>₱${order.total.toFixed(2)}</span></div>
    <div class="divider" style="margin:10px 0;"></div>
    <div class="sumline"><span>Delivered to</span><span>${order.address.label}</span></div>
    <div class="sumline"><span>Payment</span><span>${order.payment}</span></div>
  </div>
  <div style="height:14px;"></div>
  <button class="btn ghost" onclick="toast('Reorder added to cart!')">Reorder</button>
  `;
}

   SCREEN: WALLET
========================================================= */

function openTopUp(){
  openSheet(`

    <div class="chip-row" style="justify-content:center; display:flex;">

    <button class="btn ghost" onclick="closeSheet()">Cancel</button>

function doTopUp(v){

/* =========================================================
   CLOCK + INIT
========================================================= */
function tickClock(){
  const d = new Date();
  let h = d.getHours()%12; if(h===0) h=12;
  const m = d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
tickClock(); setInterval(tickClock, 15000);

buildBottomNav();
render();
setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 1600);
</script>
